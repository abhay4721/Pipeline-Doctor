name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Create a deliberate failed run for Pipeline Doctor"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev
      - name: Build dashboard
        working-directory: frontend
        run: npm run build

  simulate-failure:
    name: Deliberate failure (manual test only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
    runs-on: ubuntu-latest
    steps:
      - name: Emit a clear failure line for analysis
        run: |
          echo "ERROR: AssertionError: simulated CI failure requested manually"
          exit 1
