services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline_doctor
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline_doctor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/pipeline_doctor
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      api: {condition: service_healthy}
    ports: ["8080:80"]
    restart: unless-stopped
  # Optional local model: docker compose --profile local-ai up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes: ["ollama_data:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]
    restart: unless-stopped
volumes:
  postgres_data:
  ollama_data:
